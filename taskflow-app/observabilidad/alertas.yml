# Reglas de alerta (guía 14). El SLO es 99 % mensual: un 1 % de errores sostenido consume el presupuesto de errores
# (432 min al mes) al ritmo normal, así que es el umbral de aviso. Las reglas se evalúan en Prometheus; el envío de
# notificaciones (correo, WhatsApp) requiere Alertmanager y credenciales del propietario y NO está configurado.
groups:
  - name: taskflow-slo
    rules:
      - alert: TaskFlowErrores5xx
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1e-9) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Más del 1 % de las peticiones responde 5xx durante 5 minutos"
          runbook: "taskflow-app/docs/runbooks/Runbook_base_de_datos.md"
      - alert: TaskFlowApiCaida
        expr: up{job="taskflow-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus no puede leer las métricas de la API desde hace 1 minuto"
          runbook: "taskflow-app/docs/runbooks/Runbook_base_de_datos.md"
