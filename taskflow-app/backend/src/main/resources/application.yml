server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${DB_USER:taskflow}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000       # 5 s (antes 30 s): si la base cae, la API falla rápido en vez de colgarse
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  application:
    name: taskflow-api
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true      # permite calcular p95 con histogram_quantile en Prometheus
        taskflow.tarea.cambiar_estado: true
    tags:
      application: taskflow-api
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.1}   # 10 % de las trazas (guía 13: 0.1–0.2)
  otlp:
    tracing:
      export:
        enabled: ${OTLP_ENABLED:false}
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
logging:
  structured:
    format:
      console: logstash                 # una línea JSON por evento, con traceId y spanId cuando hay traza activa
taskflow:
  metricas-abiertas: ${METRICAS_ABIERTAS:false}   # /actuator/prometheus solo se abre dentro de una red privada (compose)
  jwt:
    secret: ${JWT_SECRET}
    ttl-hours: 24
  seed: ${SEED:true}
