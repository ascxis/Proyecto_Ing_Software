name: SonarCloud
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  sonar:
    name: Análisis estático (SonarCloud)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # historial completo para atribuir código nuevo
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: Verificar que existe SONAR_TOKEN
        env: { SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}" }
        run: test -n "$SONAR_TOKEN" || { echo "::error::Falta el secreto SONAR_TOKEN"; exit 1; }
      - name: Pruebas + análisis (backend Java, frontend React y prototipo)
        working-directory: taskflow-app/backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=ascxis
          -Dsonar.projectKey=ascxis_Proyecto_Ing_Software
          -Dsonar.sources=src/main/java,../frontend/src,../../taskflow
          -Dsonar.exclusions=**/node_modules/**,**/dist/**,../../taskflow/base.json
