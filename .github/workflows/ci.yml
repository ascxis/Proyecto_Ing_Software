name: CI

# Pipeline de integración continua con tres etapas encadenadas:
#   lint  ->  test  ->  analysis (Quality Gate de SonarCloud, bloqueante)
# Se ejecuta en cada Pull Request hacia main y en cada fusión a main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Mínimo privilegio: el pipeline solo lee el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linter (estático, sin ejecutar)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Prototipo — el HTML carga y su JavaScript es válido
        run: node pruebas/build.js taskflow/pagina.html
      - name: Prototipo — reglas estáticas y búsqueda de secretos
        run: node pruebas/lint.js taskflow/pagina.html
      - name: React — dependencias exactas del lockfile
        working-directory: taskflow-app/frontend
        run: npm ci --ignore-scripts
      - name: React — comprobación de tipos (tsc)
        working-directory: taskflow-app/frontend
        run: ./node_modules/.bin/tsc --noEmit
      - name: Ningún secreto en texto plano en workflows, Dockerfile ni compose
        run: |
          if grep -rnE "(ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA |EC )?PRIVATE KEY|SONAR_TOKEN: *[A-Za-z0-9]{20,})" .github taskflow-app/docker-compose.yml taskflow-app/backend/Dockerfile taskflow-app/frontend/Dockerfile; then
            echo "::error::Hay un posible secreto en texto plano"; exit 1
          fi

  test:
    name: Pruebas y artefacto versionado
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: Prototipo — unitarias y caja negra
        run: node --test pruebas/unitarias.test.js pruebas/caja_negra.test.js
      - name: Prototipo — regresión visual (snapshot de 37 pasos)
        run: |
          BASE=$(find . -name base.json -not -path './node_modules/*' | head -n 1)
          test -n "$BASE" || { echo "No se encontró base.json"; exit 1; }
          node pruebas/snapshot_test.js taskflow/pagina.html --comparar "$BASE"
      - name: Backend — pruebas unitarias, de integración y de contrato (JaCoCo)
        working-directory: taskflow-app/backend
        run: mvn -B -ntp verify
      - name: Frontend — build de producción
        working-directory: taskflow-app/frontend
        run: |
          npm ci --ignore-scripts
          node build.mjs
      - name: Artefacto inmutable (jar con el SHA del commit y su huella SHA-256)
        run: |
          mkdir -p dist
          cp taskflow-app/backend/target/taskflow-*.jar "dist/taskflow-api-${GITHUB_SHA::12}.jar"
          (cd dist && sha256sum taskflow-api-*.jar | tee taskflow-api-${GITHUB_SHA::12}.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: taskflow-api-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  analysis:
    name: Quality Gate (SonarCloud, bloqueante)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # historial completo para atribuir el código nuevo
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: Verificar que existe SONAR_TOKEN
        env: { SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}" }
        run: test -n "$SONAR_TOKEN" || { echo "::error::Falta el secreto SONAR_TOKEN"; exit 1; }
      - name: Análisis y espera del Quality Gate (falla el job si el gate falla)
        working-directory: taskflow-app/backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=ascxis
          -Dsonar.projectKey=ascxis_Proyecto_Ing_Software
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300
          -Dsonar.sources=src/main/java,../frontend/src,../../taskflow
          -Dsonar.coverage.exclusions=../frontend/**,../../taskflow/**,**/DatosDemo.java,**/TaskflowApplication.java
          -Dsonar.exclusions=**/node_modules/**,**/dist/**,../../taskflow/base.json

  resultado:
    # Este es el único chequeo que exige la regla de protección de main («Build, Lint y Pruebas»).
    # Se ejecuta siempre y solo queda en verde si las tres etapas, incluido el Quality Gate, pasaron:
    # así la puerta de calidad bloquea de verdad la fusión (un job «skipped» no bloquearía).
    name: Build, Lint y Pruebas
    needs: [lint, test, analysis]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Las tres etapas deben haber pasado
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }} analysis=${{ needs.analysis.result }}"
          [ "${{ needs.lint.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.analysis.result }}" = "success" ]
