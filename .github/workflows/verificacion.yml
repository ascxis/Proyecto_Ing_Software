name: Verificación (S-1, S-3, S-4 y lockfile)
on:
  pull_request:
    branches: [main]
    paths: ['taskflow-app/pruebas-carga/**', '.github/workflows/verificacion.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    name: Generar package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.head_ref || github.ref_name }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Generar lockfile si falta
        working-directory: taskflow-app/frontend
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts; fi
          ls -la package-lock.json
      - name: Confirmar el lockfile en la rama
        run: |
          if [ -n "$(git status --porcelain taskflow-app/frontend/package-lock.json)" ]; then
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add taskflow-app/frontend/package-lock.json
            git commit -m "chore: agrega package-lock.json generado en CI"
            git push
          fi
  k6:
    name: Escenarios contra PostgreSQL con k6
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: taskflow, POSTGRES_USER: taskflow, POSTGRES_PASSWORD: taskflow }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taskflow" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: Empaquetar backend
        working-directory: taskflow-app/backend
        run: mvn -B -q -DskipTests package
      - name: Levantar la API
        working-directory: taskflow-app/backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/taskflow
        run: |
          nohup java -jar target/*.jar > ../api.log 2>&1 &
          for i in $(seq 1 60); do curl -fs localhost:8080/actuator/health && break; sleep 2; done
          curl -fs localhost:8080/actuator/health
      - uses: grafana/setup-k6-action@v1
      - name: Ejecutar k6
        working-directory: taskflow-app/pruebas-carga
        run: k6 run --summary-export=resumen.json escenarios.js | tee k6.txt
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-k6
          path: |
            taskflow-app/pruebas-carga/resumen.json
            taskflow-app/pruebas-carga/k6.txt
            taskflow-app/api.log
