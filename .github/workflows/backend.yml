name: Backend (Spring Boot)
on:
  pull_request:
    branches: [main]
    paths: ['taskflow-app/backend/**']
  push:
    branches: [main]
    paths: ['taskflow-app/backend/**']
permissions:
  contents: read
jobs:
  test:
    name: mvn test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: Pruebas (núcleo + integración con H2)
        working-directory: taskflow-app/backend
        run: mvn -B -ntp test
      - name: Resumen de cobertura por clase (JaCoCo)
        if: always()
        working-directory: taskflow-app/backend
        run: |
          awk -F, 'NR>1 {m=$8; c=$9; t=m+c; printf "%-60s líneas sin cubrir=%s cubiertas=%s\n", $3"."$2, $8, $9}' target/site/jacoco/jacoco.csv | sort -t= -k2 -n -r | head -25
