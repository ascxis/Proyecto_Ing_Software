name: Backend (Spring Boot)
on:
  pull_request:
    branches: [main]
    paths: ['taskflow-app/backend/**']
  push:
    branches: [main]
    paths: ['taskflow-app/backend/**']
permissions:
  contents: read
jobs:
  test:
    name: mvn test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: Pruebas (núcleo + integración con H2)
        working-directory: taskflow-app/backend
        run: mvn -B -ntp test
