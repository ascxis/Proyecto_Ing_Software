name: Deploy (CD)

# Continuous Delivery: cada fusión a main publica una imagen inmutable en GHCR y la verifica en un
# entorno efímero (staging) con healthcheck y rollback. El paso hacia Render solo se ejecuta si el
# propietario del repositorio configuró el secreto RENDER_DEPLOY_HOOK (no se escribe nunca en el YAML).
on:
  push:
    branches: [main]
    paths: ['taskflow-app/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write          # publicar en ghcr.io con el GITHUB_TOKEN del propio workflow

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGEN: ghcr.io/${{ github.repository_owner }}/taskflow-api

jobs:
  publicar:
    name: Construir y publicar la imagen (tag = SHA)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar (el mismo artefacto que se prueba es el que se despliega)
        working-directory: taskflow-app/backend
        run: |
          IMG="${IMAGEN,,}"
          docker build -t "$IMG:${{ steps.meta.outputs.tag }}" -t "$IMG:latest" .
          docker push "$IMG:${{ steps.meta.outputs.tag }}"
          docker push "$IMG:latest"

  staging:
    name: Desplegar en staging efímero, healthcheck y rollback
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Desplegar la imagen nueva y verificarla (healthcheck posterior)
        env:
          TAG: ${{ needs.publicar.outputs.tag }}
        run: bash taskflow-app/despliegue/desplegar.sh "${IMAGEN,,}" "$TAG"

  render:
    name: Publicar en Render (opcional)
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Disparar el despliegue y comprobar /actuator/health
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ] || [ -z "$RENDER_HEALTH_URL" ]; then
            echo "::notice::Render no configurado (falta el secreto RENDER_DEPLOY_HOOK o la variable RENDER_HEALTH_URL); se omite este paso."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$RENDER_HEALTH_URL") || true
            [ "$code" = "200" ] && { echo "Render responde 200"; exit 0; }
            sleep 10
          done
          echo "::error::Render no respondió 200 tras el despliegue; revertir a la versión estable anterior desde el panel de Render"
          exit 1
