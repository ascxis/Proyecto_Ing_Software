name: Observabilidad (métricas, trazas y logs)
on:
  pull_request:
    paths: ["taskflow-app/**", ".github/workflows/observabilidad.yml"]
  push:
    branches: [main]
    paths: ["taskflow-app/**", ".github/workflows/observabilidad.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: observabilidad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  telemetria:
    name: Telemetría de punta a punta
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: taskflow-app
    steps:
      - uses: actions/checkout@v4
      - name: Generar .env temporal (sin secretos en el repositorio)
        run: |
          {
            echo "DB_PASSWORD=$(openssl rand -hex 12)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "GRAFANA_PASSWORD=$(openssl rand -hex 12)"
            echo "GRAFANA_ANONIMO=true"      # solo en este runner efímero, para tomar la captura
            echo "TRACING_SAMPLING=1.0"      # en CI se traza el 100 % para poder verlo; el valor por defecto es 0.1
          } > .env
      - name: Levantar la pila con observabilidad
        run: docker compose -f docker-compose.yml -f docker-compose.observabilidad.yml up -d --build
      - name: Esperar a que la API y Grafana estén sanas
        run: |
          for i in $(seq 1 90); do
            docker compose exec -T api wget -qO- http://localhost:8080/actuator/health 2>/dev/null | grep -q UP && break; sleep 2
          done
          docker compose exec -T api wget -qO- http://localhost:8080/actuator/health
          for i in $(seq 1 60); do curl -fs localhost:3001/api/health | grep -q ok && break; sleep 2; done
          curl -fs localhost:3001/api/health
      - name: Generar tráfico sobre el endpoint crítico durante ~90 s
        run: |
          set -e
          API="docker compose exec -T api"
          # La API no publica puerto; se entra por el nginx del frontend (puerto 3000), igual que un usuario real.
          B=http://localhost:3000/api
          reg() { curl -fs -X POST $B/auth/register -H 'Content-Type: application/json' -d "{\"nombre\":\"$1\",\"correo\":\"$1-$RANDOM@ejemplo.co\",\"clave\":\"secreto1\"}"; }
          A=$(reg Ana); BT=$(reg Beto)
          TA=$(echo "$A" | jq -r .token); TB=$(echo "$BT" | jq -r .token); IDB=$(echo "$BT" | jq -r .usuario.id)
          P=$(curl -fs -X POST $B/proyectos -H "Authorization: Bearer $TA" -H 'Content-Type: application/json' \
              -d "{\"nombre\":\"Proyecto de telemetría\",\"descripcion\":\"d\",\"fechaLimite\":\"2026-12-01\",\"miembrosIds\":[\"$IDB\"]}")
          PID=$(echo "$P" | jq -r .id)
          T=$(curl -fs -X POST $B/proyectos/$PID/tareas -H "Authorization: Bearer $TA" -H 'Content-Type: application/json' \
              -d "{\"titulo\":\"Tarea confidencial\",\"descripcion\":\"x\",\"prioridad\":\"ALTA\",\"fechaLimite\":\"2026-11-20\",\"asignadoId\":\"$IDB\"}")
          TID=$(echo "$T" | jq -r .id)
          echo "Tarea $TID creada. Enviando tráfico..."
          estados=(EN_PROCESO COMPLETADA PENDIENTE)
          fin=$((SECONDS+90)); n=0
          while [ $SECONDS -lt $fin ]; do
            n=$((n+1))
            e=${estados[$((n%3))]}
            curl -s -o /dev/null -X PATCH $B/tareas/$TID/estado -H "Authorization: Bearer $TB" -H 'Content-Type: application/json' -d "{\"estado\":\"$e\"}"      # válido (200)
            if [ $((n%5)) -eq 0 ]; then curl -s -o /dev/null -X PATCH $B/tareas/$TID/estado -H "Authorization: Bearer $TA" -H 'Content-Type: application/json' -d "{\"estado\":\"$e\"}"; fi   # no asignado (403)
            if [ $((n%7)) -eq 0 ]; then curl -s -o /dev/null -X PATCH $B/tareas/$TID/estado -H "Authorization: Bearer $TB" -H 'Content-Type: application/json' -d '{"estado":"INVENTADO"}'; fi # inválido (400)
            sleep 0.4
          done
          echo "Peticiones válidas enviadas: $n"
      - name: Consultar a Prometheus las tres señales del dashboard
        run: |
          q() { curl -fsG localhost:9090/api/v1/query --data-urlencode "query=$1" | jq -r '.data.result[0].value[1] // "sin datos"'; }
          U='uri="/api/tareas/{id}/estado"'
          echo "Tasa (req/s):        $(q "sum(rate(http_server_requests_seconds_count{$U}[1m]))")"
          echo "Latencia p95 (s):    $(q "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{$U}[1m])))")"
          echo "Errores 5xx (%):     $(q "(100 * sum(rate(http_server_requests_seconds_count{$U,status=~\"5..\"}[1m])) / sum(rate(http_server_requests_seconds_count{$U}[1m]))) or vector(0)")"
          echo "Total por código HTTP:"
          curl -fsG localhost:9090/api/v1/query --data-urlencode "query=sum by (status) (http_server_requests_seconds_count{$U})" | jq -r '.data.result[] | "  \(.metric.status): \(.value[1])"'
          echo "Resultados de negocio:"
          curl -fsG localhost:9090/api/v1/query --data-urlencode "query=sum by (resultado) (taskflow_cambios_estado_total)" | jq -r '.data.result[] | "  \(.metric.resultado): \(.value[1])"'
          test "$(q "sum(http_server_requests_seconds_count{$U})")" != "sin datos"
      - name: Reglas de alerta (guía 14) — validadas con promtool y cargadas en Prometheus
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/observabilidad:/obs:ro" prom/prometheus:v2.55.1 check rules /obs/alertas.yml
          docker run --rm --entrypoint promtool -v "$PWD/observabilidad:/obs:ro" prom/prometheus:v2.55.1 test rules /obs/alertas_test.yml
          curl -fs localhost:9090/api/v1/rules | jq -r '.data.groups[].rules[] | "  regla cargada: \(.name) (\(.state))"'
          curl -fs localhost:9090/api/v1/rules | jq -e '[.data.groups[].rules[].name] | contains(["TaskFlowErrores5xx","TaskFlowApiCaida"])'
          echo "Alertas disparándose con tráfico sano: $(curl -fs localhost:9090/api/v1/alerts | jq '[.data.alerts[] | select(.state=="firing")] | length')"
          test "$(curl -fs localhost:9090/api/v1/alerts | jq '[.data.alerts[] | select(.state=="firing")] | length')" = "0"
      - name: Verificar que Grafana tiene el dashboard y la fuente de datos
        run: |
          curl -fs "localhost:3001/api/search?query=TaskFlow" | jq -r '.[].title'
          curl -fs localhost:3001/api/search?query=TaskFlow | jq -e 'length >= 1'
      - name: El span llegó al colector (OpenTelemetry)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.observabilidad.yml logs otel-collector > /tmp/colector.log
          grep -c "taskflow.tarea.cambiar_estado" /tmp/colector.log || true
          grep -m3 -A12 "taskflow.tarea.cambiar_estado" /tmp/colector.log | head -40
          grep -q "taskflow.tarea.cambiar_estado" /tmp/colector.log
      - name: Los logs son JSON con traceId y no contienen datos personales
        run: |
          docker compose logs api --no-log-prefix > /tmp/api.log
          grep '"tareaId"' /tmp/api.log | head -3
          grep '"tareaId"' /tmp/api.log | head -200 | jq -e 'has("traceId") and has("resultado")' > /dev/null
          echo "Líneas JSON con tareaId: $(grep -c '"tareaId"' /tmp/api.log)"
          if grep -Ei "ejemplo\.co|Tarea confidencial|secreto1|Bearer " /tmp/api.log /tmp/colector.log; then echo "PII encontrada en la telemetría"; exit 1; fi
          docker compose exec -T api wget -qO- http://localhost:8080/actuator/prometheus > /tmp/metricas.txt
          if grep -E "ejemplo\.co|confidencial|\bAna\b|\bBeto\b" /tmp/metricas.txt; then echo "PII en las métricas"; exit 1; fi
          echo "Sin datos personales en logs, trazas ni métricas."
      - name: Las métricas no se exponen fuera de la red interna
        run: |
          # nginx responde 200 con el index.html de la SPA para rutas desconocidas; lo que importa es que NO sean métricas.
          curl -s localhost:3000/actuator/prometheus > /tmp/via-nginx.txt
          if grep -q "# HELP" /tmp/via-nginx.txt; then echo "¡las métricas salen por el puerto público!"; exit 1; fi
          echo "El puerto público (3000) no entrega métricas: $(head -c 60 /tmp/via-nginx.txt | tr -d '\n')"
          # y la API, aun alcanzada directamente, las niega sin METRICAS_ABIERTAS (probado en ObservabilidadTest)
      - name: Costo de almacenamiento de la telemetría (para el ADR)
        run: |
          echo "Líneas de log de la API: $(wc -l < /tmp/api.log)  ·  bytes: $(wc -c < /tmp/api.log)"
          echo "Bytes por línea JSON con tareaId (promedio): $(grep '"tareaId"' /tmp/api.log | awk '{n+=length($0)+1} END {printf "%d", n/NR}')"
          echo "Tamaño de la base de series de Prometheus:"; docker compose -f docker-compose.yml -f docker-compose.observabilidad.yml exec -T prometheus du -sk /prometheus
          echo "Series activas: $(curl -fsG localhost:9090/api/v1/query --data-urlencode 'query=count({__name__=~".+"})' | jq -r '.data.result[0].value[1]')"
          echo "Memoria de los contenedores:"; docker stats --no-stream --format '  {{.Name}}: {{.MemUsage}}' 
      - name: Captura del dashboard
        run: |
          mkdir /tmp/pw && cp observabilidad/captura.mjs /tmp/pw/ && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node captura.mjs "http://localhost:3001/d/taskflow-endpoint/x?orgId=1&from=now-6m&to=now&kiosk" /tmp/dashboard.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-observabilidad
          path: |
            /tmp/dashboard.png
            /tmp/colector.log
            /tmp/api.log
            /tmp/metricas.txt
          retention-days: 14
      - name: Apagar
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.observabilidad.yml down -v
