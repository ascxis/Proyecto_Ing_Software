name: E2E (navegador real)
# Guía 15: automatiza las pruebas de extremo a extremo de la interfaz React (Chromium) contra el servidor de desarrollo
# simulado (frontend/dev/mock-server.mjs), NO contra la API Spring Boot. Incluye un caso de XSS con un título malicioso.
on:
  pull_request:
    paths: ["taskflow-app/frontend/**", ".github/workflows/e2e.yml"]
  push:
    branches: [main]
    paths: ["taskflow-app/frontend/**", ".github/workflows/e2e.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    name: Pruebas E2E con Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: taskflow-app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskflow-app/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Ejecutar las pruebas E2E
        run: |
          set -o pipefail
          npm run test:e2e | tee e2e-resultado.txt
      - name: Todas las pruebas deben pasar (15 casos)
        run: 'grep -q "Resultado: 15/15" e2e-resultado.txt'
